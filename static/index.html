<!doctype html><html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mafiya</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0}
body{height:100vh;font:15px system-ui,sans-serif;color:#fff;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
 padding:12px 12px max(12px,env(safe-area-inset-bottom));background:linear-gradient(#7cc8ff,#e6f6ff);color:#10243a;transition:background 2s,color 2s}
body.night{background:linear-gradient(#070b24,#33206b);color:#fff}
#stars i{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;transition:opacity 2s;animation:tw 2s infinite alternate}
body.night #stars i{opacity:.9}@keyframes tw{to{transform:scale(2)}}
h1{font-size:20px;margin:6px 0}#hint{min-height:44px;text-align:center;margin:6px 0;max-width:340px}
#arena{position:relative;width:min(92vw,360px);aspect-ratio:1;margin-top:4px}
#mid{position:absolute;inset:0;margin:auto;width:120px;height:120px;display:grid;place-items:center;text-align:center}
#mid svg{position:absolute;inset:0;transform:rotate(-90deg)}
#ring{transition:stroke-dashoffset 1s linear;stroke:#ffd54a}
#orb{font-size:42px}#orb.swap{animation:rise 1.2s}@keyframes rise{from{transform:translateY(40px) rotate(-90deg);opacity:0}}
#t{font-size:13px;opacity:.8}
.pl{position:absolute;width:68px;text-align:center;transform:translate(-50%,-50%);font-size:12px;transition:.3s}
.pl b{position:relative;display:grid;place-items:center;width:50px;height:50px;margin:0 auto 2px;border-radius:50%;font-size:20px;
 background:#ffffff40;border:2px solid #ffffff90;backdrop-filter:blur(4px)}
.pl b s{position:absolute;right:-8px;bottom:-6px;font-size:16px;text-decoration:none}
.pl.pick{cursor:pointer}.pl.pick b{border-color:#ffd54a;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #ffd54a55}}
.pl.dead{filter:grayscale(1);opacity:.5}.pl.dead b::after{content:"💀";position:absolute;font-size:26px}
.pl.fresh{animation:die 1.2s}@keyframes die{0%{transform:translate(-50%,-50%) scale(1.6);filter:drop-shadow(0 0 14px red)}40%{transform:translate(-50%,-50%) rotate(-12deg)}}
.pl.chk b{border-color:#ff5252}.pl em{position:absolute;top:-6px;right:2px;background:#ff5252;color:#fff;border-radius:9px;padding:0 6px;font-style:normal}
button{font:inherit;padding:11px 22px;border:0;border-radius:12px;background:#ffd54a;color:#1b1b1b;font-weight:600;margin:4px}
#card,#win{position:fixed;inset:0;display:none;place-items:center;background:#000b;z-index:5;text-align:center;color:#fff}
#card.on,#win.on{display:grid}
.flip{width:190px;height:260px;perspective:800px}.flip>div{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:fl 1.1s .4s forwards}
.f,.k{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:grid;place-items:center;align-content:center;font-size:20px;padding:12px}
.k{background:#24104a;border:2px solid #ffd54a;font-size:60px}.f{transform:rotateY(180deg);background:#fff;color:#222}.f span{font-size:70px}
@keyframes fl{to{transform:rotateY(180deg)}}
#toast{position:fixed;top:18%;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:14px 20px;border-radius:14px;opacity:0;pointer-events:none;text-align:center;max-width:86vw}
#toast.on{animation:pop 3.2s}@keyframes pop{8%{opacity:1;transform:translateX(-50%) scale(1.1)}14%{transform:translateX(-52%)}20%{transform:translateX(-48%)}26%,85%{opacity:1;transform:translateX(-50%)}}
#win h2{font-size:30px;animation:zoom .8s}@keyframes zoom{from{transform:scale(0)}}
.rain{position:fixed;top:-30px;font-size:26px;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.sm{font-size:13px;text-align:center;max-width:340px;opacity:.9;margin:2px 0}#info{color:#ffd54a}.bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;opacity:0;transition:opacity 1.5s}.bg.on{opacity:1}
h1,#hint,#me,#info{background:#0005;color:#fff;padding:5px 12px;border-radius:12px}#info{color:#ffd54a}#hint:empty,#me:empty,#info:empty{display:none}
#prof{position:fixed;inset:0;display:none;place-items:start center;overflow-y:auto;padding-top:24px;background:linear-gradient(#000b,#000b),url(/bg-prof.jpg) center/cover;z-index:6;text-align:center;color:#fff;font-size:17px;line-height:2}#prof.on{display:grid}#snd{position:fixed;top:8px;right:8px;z-index:7;padding:6px 10px;border-radius:50%;background:#0006;color:#fff;font-size:18px;margin:0}#tour{position:fixed;inset:0;display:none;place-items:start center;overflow-y:auto;padding-top:24px;background:linear-gradient(#000b,#000b),url(/bg-prof.jpg) center/cover;z-index:6;text-align:center;color:#fff;font-size:17px;line-height:2}#tour.on{display:grid}#pg{position:fixed;left:0;right:0;top:0;bottom:calc(64px + env(safe-area-inset-bottom));display:none;place-items:start center;overflow-y:auto;padding-top:24px;background:linear-gradient(#000c,#000c),url(/bg-prof.jpg) center/cover;z-index:6;text-align:center;color:#fff;line-height:1.9}#pg.on{display:grid}
#nav{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-around;background:#111;z-index:7;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
#nav b{flex:1;font-weight:400;font-size:21px;text-align:center;color:#999;cursor:pointer;line-height:1.2}#nav b small{display:block;font-size:11px}#nav b.act{color:#ffd54a}#btns{margin-bottom:70px}@keyframes rb{0%{color:#ff5252}7%{color:#ff9800}14%{color:#ffeb3b}21%{color:#8bc34a}28%{color:#4caf50}35%{color:#00e5ff}42%{color:#03a9f4}50%{color:#448aff}57%{color:#7c4dff}64%{color:#e040fb}71%{color:#ff4081}78%{color:#ff6e40}85%{color:#ffd740}92%{color:#69f0ae}100%{color:#ff5252}}
.nm{animation:rb 12s linear infinite;font-weight:600}
#nav{justify-content:flex-start;overflow-x:auto}#nav b{flex:0 0 68px}
#pg input{width:210px;padding:9px;border-radius:10px;border:0;margin:3px;font:inherit}
#xo{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#0b1030,#33206b);z-index:20;color:#fff;text-align:center}
#xb{display:grid;grid-template-columns:repeat(3,92px);gap:8px;margin:14px 0}#xb button{height:92px;font-size:44px;background:#ffffff22;color:#fff;padding:0;margin:0}#xb img{width:60px;height:60px;object-fit:contain}</style></head><body>
<div id="stars"></div><h1 id="title">Mafiya</h1>
<div id="arena"><div id="mid"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#fff3" stroke-width="5"/>
<circle id="ring" cx="60" cy="60" r="52" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="0"/></svg>
<div><div id="orb">☀️</div><div id="t"></div></div></div></div>
<div id="me" class="sm"></div><div id="hint"></div><div id="info" class="sm"></div><div id="btns"></div><div id="toast"></div><div id="pg"></div><div id="nav"></div><div id="xo"></div>
<div id="card"><div class="flip"><div><div class="k">❓</div><div class="f" id="face"></div></div></div></div>
<div id="win"><div><h2 id="wt"></h2><div id="wr" style="margin:14px 0;line-height:1.8"></div><div id="wb"></div></div></div>
<script>
const $=s=>document.querySelector(s),tg=Telegram.WebApp;tg.ready();tg.expand();
const TN={c:"Aholi jamoasi",m:"Mafiya jamoasi",s:"Yolg'iz o'yinchi"};
const AT={mkill:"Mafiya bilan birga tunda birini o'ldirasiz",kill:"Har tun bitta odamni o'ldirasiz",shoot:"Bir marta o'q uzasiz",heal:"Har tun bitta odamni davolaysiz",heal2:"Davolaysiz va hujumdan xabar topasiz",guard:"Bir odamni himoya qilasiz (uning o'rniga o'lasiz)",check:"Odam mafiyami, tekshirasiz",team:"Odamning jamoasini bilasiz",role:"Odamning aniq rolini bilasiz",watch:"Odamga kimlar kelganini ko'rasiz",track:"Odam qayerga borganini bilasiz",block:"Odamning tungi harakatini to'sasiz",frame:"Odamni komissarga mafiyadek ko'rsatasiz",poison:"Zaharlaysiz: keyingi tunda o'ladi (davolanmasa)",mute:"Odamni ertangi ovozdan mahrum qilasiz",revive:"Bir marta o'lgan odamni tiriltirasiz"};
const FT={v:"🦺 Zirh: birinchi hujumdan omon qolasiz",2:"🗳 Ovozingiz 2 ta hisoblanadi",r:"🏹 Osilsangiz, sizga ovoz bergan birini olib ketasiz",l:"🍀 Hujumdan 50% omon qolasiz",i:"🛂 Birinchi osishdan omon qolasiz",d:"🕴 Komissarga tinch ko'rinasiz",K:"🎯 Maqsad: oxirgi tirik qolish",J:"🎯 Maqsad: sizni osishsin!",X:"🎯 Nishoningiz osilsin",S:"🎯 Maqsad: o'yin oxirigacha tirik qolish"};
const WL={civil:"🎉 Tinch aholi g'alaba qildi!",mafia:"😈 Mafiya g'alaba qildi!",killer:"🔪 Yolg'iz qotil g'alaba qildi!",jester:"🤡 Hazilkash yutdi!",exec:"🪓 Jallod yutdi!"};
const TT={lobby:"Kutish zali",roles:"Rolingiz",night:"🌙 Tun",day:"☀️ Muhokama",vote:"🗳 Ovoz berish",end:"O'yin tugadi"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let R={},ws,S={players:[],info:[]},left=0,total=1,lastKey="";
const E=k=>R[k][0],N=k=>R[k][1],send=o=>ws.send(JSON.stringify(o));
for(let i=0;i<40;i++){const s=document.createElement("i");s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*55}%;animation-delay:${Math.random()*2}s`;$("#stars").append(s)}
const MU={lobby:"lobby",roles:"night",night:"night",day:"day",vote:"day",end:"lobby"},AU={};
let muted=false,want="lobby",unlocked=false;try{muted=localStorage.getItem("mute")=="1"}catch(e){}
["lobby","night","day"].forEach(k=>{const a=new Audio(`/music-${k}.mp3`);a.loop=true;a.volume=0;a.preload="none";AU[k]=a});
function fade(a,to,stop){clearInterval(a._f);a._f=setInterval(()=>{const d=to-a.volume;if(Math.abs(d)<.03){a.volume=to;clearInterval(a._f);if(stop)a.pause()}else a.volume=Math.max(0,Math.min(1,a.volume+Math.sign(d)*.03))},100)}
function music(){for(const k in AU){const a=AU[k],on=unlocked&&!muted&&k==want&&!document.hidden&&!document.querySelector("#yp iframe");if(on){if(a.paused)a.play().catch(()=>{});fade(a,.35,false)}else if(!a.paused)fade(a,0,true)}}

document.addEventListener("pointerdown",()=>{unlocked=true;music()},{once:true});document.addEventListener("visibilitychange",music);
const BG={lobby:"lobby",roles:"night",night:"night",day:"day",vote:"vote",end:"lobby"};
["lobby","night","day","vote"].forEach(k=>{const d=document.createElement("div");d.className="bg";d.dataset.k=k;d.style.backgroundImage=`url(/bg-${k}.jpg)`;document.body.prepend(d)});
fetch("/roles").then(r=>r.json()).then(j=>{R=j;const sp=tg.initDataUnsafe.start_param||"";sp.startsWith("xo_")?openXO(sp.slice(3),true):connect()});
function connect(){ws=new WebSocket(`${location.protocol=="https:"?"wss":"ws"}://${location.host}/ws?room=${encodeURIComponent(tg.initDataUnsafe.start_param||"test")}&init=${encodeURIComponent(tg.initData)}`);
 ws.onclose=()=>setTimeout(()=>location.reload(),3000);ws.onmessage=e=>{const n=JSON.parse(e.data);if(n.note){toast(esc(n.note));return}render(S,n);S=n}}
setInterval(()=>{left=Math.max(0,left-1);$("#t").textContent=S.phase=="lobby"||S.phase=="end"?"":left+" s";$("#ring").style.strokeDashoffset=327*(1-left/total)},1000);
function btn(t,f){const b=document.createElement("button");b.textContent=t;b.onclick=f;$("#btns").append(b)}
function desc(k,n){const[e,nm,tm,a,u,f]=R[k];return `${e} <b>${nm}</b> · ${TN[tm]}<br>${a?AT[a]+(u?` (qoldi: ${n.uses})`:""):"Tungi harakat yo'q"}${[...f].map(c=>"<br>"+FT[c]).join("")}`}
const who=(n,id,full)=>{const p=n.players.find(q=>q.id==id);return p?esc(p.name)+(full&&p.role?` (${E(p.role)} ${N(p.role)})`:""):""};
function render(o,n){
 const night=["night","roles"].includes(n.phase);document.body.className=night?"night":"";document.querySelectorAll(".bg").forEach(b=>b.classList.toggle("on",b.dataset.k==BG[n.phase]));want=MU[n.phase];music();
 $("#title").textContent=TT[n.phase]+(n.day&&n.phase!="end"?" · "+n.day+"-kun":"");
 if(o.phase!==n.phase){total=Math.max(n.left,1);const b=$("#orb");b.textContent=night?"🌙":"☀️";b.classList.remove("swap");void b.offsetWidth;b.classList.add("swap")}
 left=n.left;const me=n.players.find(p=>p.id==n.me),alive=me&&me.alive,R_=n.players.length;
 const canAct=alive&&!n.acted&&n.phase=="night"&&n.act,canVote=alive&&!n.muted&&n.phase=="vote";
 const okT=p=>n.act=="revive"?!p.alive:p.alive&&(p.id!=n.me||/^heal/.test(n.act))&&!(n.act=="mkill"&&p.role&&R[p.role][2]=="m");
 document.querySelectorAll(".pl").forEach(x=>x.remove());
 n.players.forEach((p,i)=>{const a=2*Math.PI*i/R_-Math.PI/2,el=document.createElement("div"),was=o.players.find(q=>q.id==p.id);
  el.className="pl"+(p.alive?"":" dead")+(was&&was.alive&&!p.alive?" fresh":"");
  el.style.left=50+40*Math.cos(a)+"%";el.style.top=50+40*Math.sin(a)+"%";
  if(canVote?p.alive:canAct&&okT(p)){el.classList.add("pick");el.onclick=()=>send(canVote?{t:"vote",to:p.id}:{t:"act",to:p.id})}
  el.innerHTML=`<b${p.ph?` style="background:url('${esc(p.ph)}') center/cover"`:""}>${p.ph?"":esc(([...p.name][0]||"?").toUpperCase())}${p.role&&n.phase!="lobby"?`<s>${E(p.role)}</s>`:""}</b>${p.id==n.me?"👉 ":""}${n.phase=="end"&&p.w?"🏆":""}<span class="nm">${esc(p.name)}</span>${p.votes?`<em>${p.votes}</em>`:""}`;
  $("#arena").append(el)});
 $("#me").innerHTML=n.phase!="lobby"&&n.role?desc(n.role,n)+(n.tgt?`<br>🎯 Nishon: ${esc(n.tgt)}`:""):"";
 $("#info").innerHTML=n.info.map(esc).join("<br>");drawPage(n);
 let h="";$("#btns").innerHTML="";
 if(n.phase=="lobby"){h=`O'yinchilar: ${R_} (kamida ${n.min}). Do'stlaringizni chaqiring!`;if(n.can)btn("Boshlash",()=>send({t:"start"}))}
 else if(n.phase=="roles")h="Rollar tarqatilmoqda...";
 else if(n.phase=="night")h=canAct?"👆 Nishonni tanlang":!alive?"💀 Siz o'ldingiz. Tomosha qiling.":n.acted?"✅ Tanlov qabul qilindi":"Tun... Siz uxlayapsiz 😴";
 else if(n.phase=="day")h="Guruh chatida muhokama qiling: kim mafiya?";
 else if(n.phase=="vote"){h=n.muted?"🤐 Siz bugun ovoz bera olmaysiz":canVote?"Kimni osamiz? Ismini bosing.":"Ovoz berish...";if(canVote)btn("⏭ Hech kimni emas",()=>send({t:"vote",to:0}))}
 $("#hint").innerHTML=h;
 if(n.phase=="roles"&&o.phase!="roles"&&n.role){$("#face").innerHTML=`<div><span>${E(n.role)}</span><br>${N(n.role)}</div>`;$("#card").classList.add("on");setTimeout(()=>$("#card").classList.remove("on"),5000)}
 if(n.news){const w=n.news,k=n.day+w.kind+w.dead+w.rev;if(k!=lastKey){lastKey=k;const d=w.dead.map(i=>who(n,i,1)).join("<br>"),v=w.rev.map(i=>who(n,i)).join(", ");
  toast(w.kind=="night"?(w.dead.length?`☠️ Tunda o'ldirildi:<br>${d}`:"🌅 Tun xotirjam o'tdi. Hech kim o'lmadi.")+(v?`<br>🕯 Tirildi: ${v}`:""):w.dead.length?`⚰️ Osildi:<br>${d}`:w.imm?"🛂 Imtiyozli omon qoldi!":"🤷 Hech kim chiqarilmadi.")}}
 if(n.win&&!o.win)setTimeout(()=>{$("#wt").textContent=WL[n.win];
  $("#wr").innerHTML=n.players.map(p=>`${p.w?"🏆 +20🪙":p.alive?"✅":"💀"} ${esc(p.name)} — ${E(p.role)} ${N(p.role)}`).join("<br>");$("#wb").innerHTML="";
  if(n.can){const b=document.createElement("button");b.textContent="Yana o'ynash";b.onclick=()=>{send({t:"again"});$("#win").classList.remove("on")};$("#wb").append(b)}
  $("#win").classList.add("on");for(let i=0;i<24;i++){const r=document.createElement("div");r.className="rain";r.textContent=n.win=="mafia"?"😈":"🎉";r.style.left=Math.random()*100+"%";r.style.animationDelay=Math.random()*1.5+"s";document.body.append(r);setTimeout(()=>r.remove(),5000)}},2500);
 if(n.phase=="lobby"&&o.phase=="end")$("#win").classList.remove("on");
}
async function buy(k){const r=await fetch("/invoice",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({init:tg.initData,item:k})}).then(r=>r.json());r.link?tg.openInvoice(r.link):toast("Xato, qayta urining")}
const SH={shield:["🛡 Qalqon",5],vote2:["🗳 2x ovoz",7],luck:["🍀 Omad",4]},PK=[["d10","💎 10 · ⭐25"],["d50","💎 50 · ⭐110"],["d120","💎 120 · ⭐230"]],PL=[["p1","1 kun · ⭐5"],["p3","3 kun · ⭐8"],["p10","10 kun · ⭐15"],["p30","1 oy · ⭐50"]];
const NAV=[["game","🎮","O'yin"],["tour","🏆","Turnir"],["shop","🛒","Do'kon"],["gift","🎁","Sovg'a"],["prem","👑","Premium"],["xo","❌⭕","X O"],["prof","👤","Profil"]];
let page=null,gk="dia";const iv={};
const inp=(k,ph,v)=>`<input placeholder="${ph}" value="${esc(iv[k]!==undefined?iv[k]:(v||""))}" oninput="iv.${k}=this.value">`;
NAV.forEach(([k,e,l])=>{const x=document.createElement("b");x.dataset.k=k;x.innerHTML=`${e}<small>${l}</small>`;x.onclick=()=>{page=k=="game"?null:k;drawPage(S)};$("#nav").append(x)});
const own=t=>tg.openTelegramLink("https://t.me/mubashirbek?text="+encodeURIComponent(t));
function mus(){const m=$("#mus");if(!m)return;if(page!="prof"){m.innerHTML="";music();return}if(m.firstChild)return;
 m.innerHTML=`<hr style="opacity:.2"><b>🎵 Musiqa (YouTube)</b><br>${inp("yl","YouTube havolasi")}<br><button id="ya">▶️ Qo'yish</button><div id="yp"></div>`;
 $("#ya").onclick=()=>{const u=iv.yl||"",v=(u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/)||[])[1],l=(u.match(/[?&]list=([\w-]+)/)||[])[1],
  src=l?`https://www.youtube.com/embed/videoseries?list=${l}&playsinline=1`:v?`https://www.youtube.com/embed/${v}?playsinline=1`:"";
  $("#yp").innerHTML=src?`<iframe width="340" height="220" src="${src}" allow="autoplay; encrypted-media" allowfullscreen style="border:0;border-radius:12px;margin-top:8px"></iframe>`:"Havola noto'g'ri";music()}}
function drawPage(n){const p=$("#pg"),lob=n.phase=="lobby";$("#nav").style.display=lob?"flex":"none";if(!lob)page=null;
 document.querySelectorAll("#nav b").forEach(x=>x.classList.toggle("act",x.dataset.k==(page||"game")));
 if(!page){p.classList.remove("on");mus();return}
 if(!$("#pgc"))p.innerHTML='<div style="max-width:340px;padding:8px 8px 20px"><div id="pgc"></div><div id="mus"></div></div>';
 const s=n.st||{games:0,wins:0,coins:0},i=n.inv||{},t=n.trn,w=n.tour||{prizes:[0,0,0],top:[],me:{}},pf=n.pf||{},pm=n.pm||{left:0,nick:""},m=n.players.find(q=>q.id==n.me),mine=t&&t.win.find(x=>x[4]==n.me);let h="";
 if(page=="prof")h=`${m&&m.ph?`<img src="${esc(m.ph)}" style="width:76px;height:76px;border-radius:50%"><br>`:""}<b class="nm">${esc(m?m.name:"")}</b><br><span style="color:#ff5252">🆔 Sizning ID: <b>${n.me}</b><br><small>Sovg'a olish uchun do'stingiz shu ID ni yozadi</small></span><br>🎮 ${s.games} o'yin · 🏆 ${s.wins} g'alaba<br>🪙 ${s.coins} · 💎 ${i.dia||0}<br>🛡 ${i.shield||0} · 🗳 ${i.vote2||0} · 🍀 ${i.luck||0}<br>${pf.g?"Jins: "+(pf.g=="m"?"👦 o'g'il bola":"👧 qiz bola"):""}<br>${pf.pid?`💞 Juftingiz: <b>${esc(pf.pn||pf.pid)}</b>`:"💔 Hozircha para yo'q"}`;
 else if(page=="shop")h=`<b>🛒 Do'kon</b> · 💎 ${i.dia||0}`;
 else if(page=="gift")h=`<b>🎁 Sovg'a yuborish</b><br>Do'stingiz ID si:<br>${inp("gid","ID")}<br>${inp("gn","Miqdor")}<br>Nima yuborasiz?`;
 else if(page=="prem"){const L=pm.left;h=`<b>👑 Premium</b><br>${L?`✅ Faol: ${Math.floor(L/86400)} kun ${Math.floor(L%86400/3600)} soat qoldi`:"❌ Faol emas"}<br><small>Premium bilan Telegram nomingiz o'rniga o'zingiz yozgan maxsus nom chiqadi va nomingiz yonida 🦌 belgisi bo'ladi</small>`}
 else if(page=="xo")h=`<b>❌⭕ X O</b><br><small>Do'stingiz ID sini yozing, unga taklif boradi. 1 daqiqa ichida javob bermasa, taklif rad etiladi. Bu o'yinda olmos va tanga berilmaydi.</small><br>${inp("xid","Do'stingiz ID si")}`;
 else{const H=t?Math.floor(t.left/3600):0;h=(t?`<b>🏆 Turnir #${t.id}</b><br>`+(t.st=="open"?`Kirish: ${t.price} ⭐ · Qatnashchilar: ${t.n} (kamida ${t.min})<br>🎁 Fond: ${t.pool} ⭐, eng yaxshi 20% ga bo'linadi<br>⏳ ${Math.floor(H/24)} kun ${H%24} soat · Ball: o'yin +1, g'alaba +3<br><small>${t.n<t.min?t.min+" kishi yig'ilmasa, ⭐ qaytariladi":"✅ Turnir bo'ladi"}</small>`:t.st=="done"?"✅ Yakunlandi":"↩️ Bekor qilindi, ⭐ qaytarildi")
  +`<div style="text-align:left;margin:8px 0">${(t.st=="done"?t.win.map(x=>`${x[0]}. ${esc(x[1])} — ${x[2]} ⭐`):t.top.map((r,j)=>`${j+1}. ${esc(r[0])} — ${r[1]}`)).join("<br>")||"Hali ball yo'q"}</div>`+(t.in&&t.st=="open"?`Siz: ${t.pts} ball`:""):"🏆 Hozir turnir yo'q.")
  +`<hr style="opacity:.2"><b>📊 Haftalik reyting</b><br><small>🥇 ${w.prizes[0]}💎 +👑 · 🥈 ${w.prizes[1]}💎 · 🥉 ${w.prizes[2]}💎</small><div style="text-align:left;margin:8px 0">${w.top.map((r,j)=>`${j+1}. ${esc(r[0])} — ${r[1]}`).join("<br>")||"Hali o'yin yo'q"}</div>${w.me.rank?`Siz: ${w.me.rank}-o'rin · ${w.me.pts} ball`:""}`}
 $("#pgc").innerHTML=h+'<div id="pb"></div>';
 const pb=$("#pb"),hd=x=>{const d=document.createElement("div");d.textContent=x;d.style.cssText="margin:8px 0 2px;opacity:.8";pb.append(d)},b=(x,f)=>{const e=document.createElement("button");e.textContent=x;e.onclick=f;pb.append(e)};
 if(page=="shop"){hd("Olmos bilan");for(const k in SH)b(`${SH[k][0]} · ${SH[k][1]}💎 (bor: ${i[k]||0})`,()=>send({t:"buy",item:k}));

 p.classList.add("on");mus()}
let xw=null,XONLY=false;
function openXO(code,only){XONLY=only;const o=$("#xo");o.style.display="flex";o.innerHTML="<div>⏳ Ulanmoqda...</div>";
 xw=new WebSocket(`${location.protocol=="https:"?"wss":"ws"}://${location.host}/xows?code=${code}&init=${encodeURIComponent(tg.initData)}`);
 xw.onmessage=e=>xoDraw(JSON.parse(e.data));xw.onclose=()=>{if($("#xo").dataset.end!="1"&&!$("#xo").dataset.ok)$("#xo").innerHTML="<div>Taklif eskirgan yoki topilmadi.</div><button onclick='xoClose()'>Yopish</button>"}}
function xoClose(){if(xw)xw.close();$("#xo").style.display="none";$("#xo").dataset.ok="";if(XONLY)tg.close()}
const xs=(m,i)=>{const c=m=="X"?"❌":m=="O"?"⭕":"";return m?`<img src="/xo-${m.toLowerCase()}.png" onerror="this.replaceWith('${c}')">`:""};
function xoDraw(s){const o=$("#xo");o.dataset.ok="1";const me=String(tg.initDataUnsafe.user?tg.initDataUnsafe.user.id:""),opp=Object.entries(s.nm).find(([k])=>k!=me),mine=s.turn==s.you;
 const msg={wait:"⏳ Taklif yuborildi. Javob kutilmoqda (1 daqiqa)...",expired:"⌛ Taklifingiz rad etildi. Boshqa odam bilan o'ynang.",declined:"❌ Taklif rad etildi. Boshqa odam bilan o'ynang.",play:mine?`Sizning navbatingiz (${s.you==="X"?"❌":"⭕"})`:"Raqib o'ylayapti...",
  end:s.w=="d"?"🤝 Durang":s.w=="left"?`🚪 ${esc(s.left||"Raqib")} chiqib ketdi`:s.w==s.you?"🎉 Siz yutdingiz!":"😔 Raqib yutdi"}[s.st];
 o.dataset.end=["expired","declined"].includes(s.st)?"1":"";
 o.innerHTML=`<b>❌⭕ X O</b><div style="margin:6px 0">Siz: ${s.you=="X"?"❌":"⭕"}${opp?` · Raqib: ${esc(opp[1])}`:""}</div><div>${msg}</div><div id="xb"></div><div id="xbt"></div>`;
 s.board.forEach((c,i)=>{const e=document.createElement("button");e.innerHTML=xs(c);e.onclick=()=>xw.send(JSON.stringify({t:"move",i}));$("#xb").append(e)});
 const x=(t,f)=>{const e=document.createElement("button");e.textContent=t;e.onclick=f;$("#xbt").append(e)};
 if(["wait","play"].includes(s.st))x("🚪 Chiqish",()=>{xw.send(JSON.stringify({t:"leave"}));xoClose()});else{if(s.st=="end")x("🔁 Yana",()=>xw.send(JSON.stringify({t:"again"})));x("Yopish",xoClose)}}
function toast(h){const t=$("#toast");t.innerHTML=h;t.classList.remove("on");void t.offsetWidth;t.classList.add("on")}
